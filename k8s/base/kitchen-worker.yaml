apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kitchen-worker
  template:
    metadata:
      labels:
        app: kitchen-worker
    spec:
      containers:
        - name: kitchen-worker
          image: dhaba-devops-platform/kitchen-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: dhaba
            - name: POSTGRES_USER
              value: dhaba
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -f /tmp/heartbeat ] && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60 ]'
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -f /tmp/heartbeat ] && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60 ]'
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -f /tmp/heartbeat ] && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60 ]'
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
