apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-monitor
  namespace: ops
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: ops-monitor
          restartPolicy: Never


          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: ops-monitor
              image: dhaba-devops-platform/ops-monitor:latest
              imagePullPolicy: IfNotPresent

              command:
                - /opt/monitor/ops-monitor.sh

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL

              resources:
                requests:
                  cpu: 50m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 96Mi

              env:
                - name: SUMMARY_INTERVAL
                  value: "1800"

                - name: OPS_NAMESPACE
                  value: ops

                - name: OPS_CONFIGMAP
                  value: ops-monitor-state
