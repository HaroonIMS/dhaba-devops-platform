# Cluster-wide permissions for infrastructure monitoring.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-monitor-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - events
      - persistentvolumeclaims
    verbs:
      - list

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
    verbs:
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-monitor-reader
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-monitor-reader

---
# Application and database monitoring permissions in staging.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-monitor-reader
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-monitor-reader
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-monitor-reader

---
# Application and database monitoring permissions in production.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-monitor-reader
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-monitor-reader
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-monitor-reader

---
# Monitoring state permissions in ops namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-monitor-state
  namespace: ops
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - ops-monitor-state
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-monitor-state
  namespace: ops
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-monitor-state
